name: Unified Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # --- RUST (wakem-r) ---
  build-rust:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: wakem-macos
            binary: target/release/wakem
          - os: ubuntu-latest
            artifact: wakem-linux
            binary: target/release/wakem
          - os: windows-latest
            artifact: wakem-windows.exe
            binary: target/release/wakem.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          cd wakem-r
          cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.artifact }}
          path: wakem-r/${{ matrix.binary }}

  publish-rust:
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ShadAdman/wakem-r
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  # --- GO (wakem-g) ---
  build-go:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: wakem-macos
            binary: wakem
          - os: ubuntu-latest
            artifact: wakem-linux
            binary: wakem
          - os: windows-latest
            artifact: wakem-windows.exe
            binary: wakem.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: |
          cd wakem-g
          go build -o ${{ matrix.binary }} ./cmd/wakem
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.artifact }}
          path: wakem-g/${{ matrix.binary }}

  publish-go:
    needs: build-go
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ShadAdman/wakem-g
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  # --- KOTLIN (wakem-k) ---
  build-kotlin:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macosArm64
            binary: cli/build/bin/macosArm64/releaseExecutable/wakem.kexe
            artifact: wakem-macos-arm64
          - os: ubuntu-latest
            target: linuxX64
            binary: cli/build/bin/linuxX64/releaseExecutable/wakem.kexe
            artifact: wakem-linux-x64
          - os: windows-latest
            target: mingwX64
            binary: cli/build/bin/mingwX64/releaseExecutable/wakem.exe
            artifact: wakem-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Build
        run: |
          cd wakem-k
          ./gradlew :cli:linkReleaseExecutable${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-${{ matrix.artifact }}
          path: wakem-k/${{ matrix.binary }}

  publish-kotlin:
    needs: build-kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: kotlin-*
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ShadAdman/wakem-k
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  # --- TYPESCRIPT (wakem-t) ---
  build-typescript:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node18-macos-x64
            artifact: wakem-t-macos
            binary: wakem-t-macos
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: wakem-t-linux
            binary: wakem-t-linux
          - os: windows-latest
            target: node18-win-x64
            artifact: wakem-t-windows
            binary: wakem-t-win.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wakem-t/package-lock.json
      - name: Build
        run: |
          cd wakem-t
          npm install
          npm run build
          npx pkg . --targets ${{ matrix.target }} --output ${{ matrix.binary }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: typescript-${{ matrix.artifact }}
          path: wakem-t/${{ matrix.binary }}

  publish-typescript:
    needs: build-typescript
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: typescript-*
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ShadAdman/wakem-t
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
